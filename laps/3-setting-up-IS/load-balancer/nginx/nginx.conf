# A log line that shows which upstream actually served each request.
log_format lb '$remote_addr "$request" $status '
              '-> upstream=$upstream_addr '
              'upstream_time=$upstream_response_time total=$request_time';

# The pool of backends. No method is declared, so Nginx uses its default:
# round robin — request 1 to backend1, 2 to backend2, 3 to backend3, repeat.
upstream backend_pool {
    server backend1:80 max_fails=3 fail_timeout=10s;
    server backend2:80 max_fails=3 fail_timeout=10s;
    server backend3:80 max_fails=3 fail_timeout=10s;

    # Reuse connections to the backends instead of opening a new one per request
    keepalive 16;
}

server {
    listen 80;
    server_name localhost;

    access_log /var/log/nginx/access.log lb;

    # Surface the chosen backend to the client so you can watch balancing happen
    add_header X-Upstream $upstream_addr always;

    # The load balancer's own health, answered without touching a backend
    location = /lb-health {
        access_log off;
        default_type text/plain;
        return 200 "load-balancer ok\n";
    }

    location / {
        proxy_pass http://backend_pool;

        # Required for upstream keepalive to actually be used
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Fail over quickly to the next backend if one is down or unhealthy
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
    }
}
