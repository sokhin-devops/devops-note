services:
  load-balancer:
    image: nginx:latest
    container_name: load-balancer
    restart: unless-stopped

    ports:
      - "8080:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - backend1
      - backend2
      - backend3

  backend1:
    image: nginx:alpine
    container_name: backend1
    restart: unless-stopped
    environment:
      - "BACKEND_NAME=backend1"
      - "BACKEND_COLOR=#2563eb"
    volumes:
      - ./backend/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./backend/html:/usr/share/nginx/html:ro

  backend2:
    image: nginx:alpine
    container_name: backend2
    restart: unless-stopped
    environment:
      - "BACKEND_NAME=backend2"
      - "BACKEND_COLOR=#16a34a"
    volumes:
      - ./backend/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./backend/html:/usr/share/nginx/html:ro

  backend3:
    image: nginx:alpine
    container_name: backend3
    restart: unless-stopped
    environment:
      - "BACKEND_NAME=backend3"
      - "BACKEND_COLOR=#db2777"
    volumes:
      - ./backend/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./backend/html:/usr/share/nginx/html:ro
