<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>__BACKEND_NAME__</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --accent: __BACKEND_COLOR__;
    --accent-dark: color-mix(in srgb, var(--accent) 75%, black);
    --bg-1: color-mix(in srgb, var(--accent) 8%, white);
    --bg-2: color-mix(in srgb, var(--accent) 18%, white);
    --ink: #1e293b;
    --muted: #64748b;
    --card: #ffffff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
    color: var(--ink);
  }

  .card {
    background: var(--card);
    border-radius: 20px;
    padding: 3rem 3.5rem;
    box-shadow: 0 20px 50px -12px rgba(15, 23, 42, 0.22);
    max-width: 420px;
    text-align: center;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 64px;
    height: 64px;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    color: white;
    font-size: 1.75rem;
    margin-bottom: 1.25rem;
  }

  h1 {
    margin: 0 0 0.5rem;
    font-size: 1.75rem;
    letter-spacing: -0.01em;
  }

  p {
    margin: 0.25rem 0;
    color: var(--muted);
    line-height: 1.5;
  }

  .tag {
    display: inline-block;
    margin-top: 1.5rem;
    padding: 0.35rem 0.9rem;
    border-radius: 999px;
    background: var(--bg-1);
    color: var(--accent-dark);
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">&#9878;</div>
    <h1>__BACKEND_NAME__</h1>
    <p>The load balancer sent this request to <strong>__BACKEND_NAME__</strong>. Reload the page and watch the colour change as round robin moves to the next backend.</p>
    <span class="tag">SERVED BY __BACKEND_NAME__</span>
  </div>
</body>
</html>
