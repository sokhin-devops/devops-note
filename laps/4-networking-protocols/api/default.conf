# The same machine idea, a different service endpoint: port 3000, not 80.
server {
    listen 3000;
    server_name api.lab.internal;

    add_header X-Served-By "api (172.30.0.20:3000)" always;

    location = /health {
        default_type application/json;
        return 200 '{"service":"api","status":"ok"}';
    }

    location / {
        default_type application/json;
        return 200 '{"service":"api","address":"172.30.0.20","port":3000,"protocol":"http"}';
    }
}
