# A log line that shows both ends of the TCP connection: who connected from
# which source port, and which address:port of ours they landed on.
log_format netlab '$remote_addr:$remote_port -> $server_addr:$server_port '
                  '"$request" $status ${body_bytes_sent}b '
                  'host=$host ua="$http_user_agent"';

server {
    listen 80;
    server_name web.lab.internal www.lab.internal localhost;

    access_log /var/log/nginx/access.log netlab;

    add_header X-Served-By "web (172.30.0.10:80)" always;

    location = /whoami {
        default_type text/plain;
        return 200 "web.lab.internal -> 172.30.0.10:80\n";
    }

    # Status codes you can request on demand (lesson section 23)
    location = /redirect {
        return 301 /;
    }

    location = /status/404 {
        default_type text/plain;
        return 404 "404 Not Found - the server was reached, the path was not\n";
    }

    location = /status/500 {
        default_type text/plain;
        return 500 "500 Internal Server Error - the server failed, not you\n";
    }

    location = /status/503 {
        default_type text/plain;
        return 503 "503 Service Unavailable - reached, but not ready\n";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}
