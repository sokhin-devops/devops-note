; The exact group split from D8.configuration-management.md, section 7 —
; two webservers and one database, just pointed at this lab's containers
; instead of real IPs. Ansible resolves "web1" etc. as ansible_host by
; default, and Docker's own DNS resolves that name on the labnet network.

[webservers]
web1
web2

[databases]
db1

[all:vars]
ansible_user=ansible
ansible_ssh_private_key_file=/root/.ssh/id_ed25519
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
